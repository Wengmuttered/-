# ============================================================
# 个人隐私数据安全管家 - 开发环境配置
# ============================================================

spring:
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/privacyguard
    username: postgres
    password: 1967748190wjk
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 开发环境配置
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: qq120120
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# MinIO 文件存储配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: privacyguard

# JWT 配置
jwt:
  secret: privacyguard-secret-key-2026-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000      # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）

# 日志级别（开发环境更详细）
logging:
  level:
    com.privacyguard: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
